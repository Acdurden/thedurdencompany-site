<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paint Pad">
<meta name="theme-color" content="#FFF4E6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Paint Pad</title>
<style>
/* Fredoka font, stored with the app (SIL Open Font License, see fonts/OFL-LICENSE.txt) */
@font-face{font-family:'Fredoka';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/fredoka-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
:root{--ink:#2B2340;--soft:#5B5170;--bg:#FFF4E6;--line:#F1E6D6;--pick:#FFE9A8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{
  position:fixed;inset:0;
  font-family:'Fredoka',system-ui,-apple-system,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "tools stage" "bottom bottom";
  gap:14px;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
button{font-family:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
svg{display:block}
header{grid-area:top;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:default}
.brand b{font-size:30px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.btn{height:56px;padding:0 18px;border:0;border-radius:18px;background:#fff;box-shadow:0 3px 0 rgba(43,35,64,.14);display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
.btn:active,.tool:active,.opt:active,.sw:active{transform:translateY(2px)}
.btn.go{background:#2A9D55;color:#fff;box-shadow:0 3px 0 rgba(20,80,40,.35)}
.btn.sq{width:56px;padding:0;justify-content:center}
.btn:disabled{opacity:.4}
#tools{grid-area:tools;display:flex;flex-direction:column;gap:10px;min-height:0}
.tool{width:92px;flex:1 1 0;min-height:0;max-height:88px;border-radius:24px;border:4px solid #fff;background:#fff;box-shadow:0 3px 0 rgba(43,35,64,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:15px;font-weight:600}
.tool.on{border-color:var(--ink);background:var(--pick)}
#stage{grid-area:stage;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden}
#paper{position:relative;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 6px 0 rgba(43,35,64,.10)}
#paper canvas{position:absolute;inset:0;width:100%;height:100%}
#prev{touch-action:none}
footer{grid-area:bottom;display:flex;align-items:center;gap:16px;background:#fff;border-radius:26px;padding:12px 18px;box-shadow:0 4px 0 rgba(43,35,64,.10)}
#colors{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;padding:0;box-shadow:0 0 0 2px #E8DCCB}
.sw.on{box-shadow:0 0 0 4px var(--ink)}
.div{width:3px;align-self:stretch;background:var(--line);border-radius:2px}
/* fixed size, so switching tools never changes the bottom bar or the paper */
#opts{display:flex;align-items:center;gap:8px;flex:none;width:340px;height:56px;overflow:hidden}
#opts .lbl{font-size:15px;font-weight:600;color:var(--soft)}
#opts .hint{font-size:17px;font-weight:500;color:var(--soft);line-height:1.2}
.opt{width:50px;height:50px;flex:none;border-radius:18px;border:3px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.opt.on{border-color:var(--ink);background:var(--pick)}
.dot{display:block;border-radius:50%}
.ov{position:fixed;inset:0;z-index:20;background:rgba(43,35,64,.55);display:none;align-items:center;justify-content:center;padding:24px}
.ov.show{display:flex}
.card{background:#fff;border-radius:36px;padding:28px 32px 32px;width:100%;max-width:1040px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:20px;box-shadow:0 10px 0 rgba(43,35,64,.25)}
.card h2{margin:0;font-size:38px;font-weight:700}
.cardtop{display:flex;align-items:center;gap:16px}
.cardtop h2{flex:1}
.hold{position:relative;overflow:hidden}
.hold::after{content:'';position:absolute;left:0;bottom:0;height:7px;width:calc(var(--p,0) * 100%);background:#FF4D4D;border-radius:0 4px 4px 0}
#bubble{position:fixed;z-index:40;background:var(--ink);color:#fff;border-radius:14px;padding:9px 15px;font-size:17px;font-weight:500;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#bubble.show{opacity:1}
.who{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%}
.kid{height:170px;border-radius:30px;border:0;font-size:42px;font-weight:700;color:#fff !important;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.kid:active{transform:translateY(3px)}
.setrow{display:flex;gap:14px;justify-content:center;align-items:center;font-size:20px;font-weight:500}
.fine{font-size:15px;color:var(--soft)}
.letbtn{position:absolute;right:18px;bottom:18px;z-index:3;height:72px;padding:0 26px 0 20px;border:0;border-radius:26px;color:#fff !important;font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.letbtn[hidden]{display:none}
.letbtn:active{transform:translateY(3px)}
.playrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.playrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
.play{height:118px;border:0;border-radius:24px;color:#fff !important;font-size:20px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.play:active{transform:translateY(3px)}
.sub{margin:4px 0 0;font-size:24px;font-weight:700}
.ov.scene{background:var(--bg);align-items:stretch;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.scenewrap{display:flex;flex-direction:column;gap:14px;width:100%;height:100%}
.scenetop{display:flex;align-items:center;gap:14px;min-height:56px}
#sceneTitle{flex:1;font-size:30px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scenePill{height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;font-size:17px;font-weight:600;background:#fff;color:var(--soft);white-space:nowrap}
#sceneBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#sceneCv{border-radius:28px;touch-action:none;box-shadow:0 6px 0 rgba(43,35,64,.10)}
.close{width:60px;height:60px;border-radius:20px;border:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
#pageGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.pg{border:4px solid var(--line);border-radius:26px;background:#fff;padding:12px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:22px;font-weight:600}
.pg.blank{border-style:dashed;border-color:#D9CCB8}
.pg canvas{width:100%;aspect-ratio:4/3;height:auto}
.center{align-items:center;text-align:center}
#saveImg{max-width:100%;max-height:52vh;border-radius:22px;border:4px solid var(--line);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.tip{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:18px;padding:12px 18px;font-size:20px;font-weight:500}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.big{height:62px;padding:0 28px;font-size:21px;border-radius:20px}
.small{max-width:560px}
@media (max-width:900px){
  .brand b{font-size:24px}
  .btn .t{display:none}
  .btn{padding:0;width:56px;justify-content:center}
  footer{flex-wrap:wrap}
  .div{display:none}
  #opts{min-width:0}
}
/* shorter screens (iPad mini, Safari with its bars showing): tools shrink so all six fit */
@media (max-width:1100px){.sw{width:38px;height:38px}#colors{gap:6px}#opts{width:294px;gap:6px}.opt{width:44px;height:44px}}
@media (max-height:760px){#tools{gap:8px}.tool{width:84px;font-size:13px;gap:2px;border-radius:20px}.tool svg{width:28px;height:28px}}
@media (max-height:620px){.tool{width:76px;font-size:12px}.tool svg{width:24px;height:24px}}
</style>
</head>
<body>

<header>
  <button class="brand" id="brand" type="button" aria-label="Paint Pad. Grown-ups: press and hold for settings">
    <svg width="48" height="48" viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="44" fill="#3A6FF7"/><g fill="none" stroke-width="18" stroke-linecap="round"><path d="M38 140 A62 62 0 0 1 162 140" stroke="#FF4D4D"/><path d="M60 140 A40 40 0 0 1 140 140" stroke="#FFD60A"/><path d="M82 140 A18 18 0 0 1 118 140" stroke="#FFFFFF"/></g></svg>
    <b id="title">Paint Pad</b>
  </button>
  <button class="btn" id="undoBtn" type="button" aria-label="Undo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="t">Undo</span></button>
  <button class="btn" id="picsBtn" type="button" aria-label="Pictures"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span class="t">Pictures</span></button>
  <button class="btn go" id="saveBtn" type="button" aria-label="Save"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span class="t">Save</span></button>
  <button class="btn sq hold" id="blankBtn" type="button" aria-label="Blank paper"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5"/></svg></button>
  <button class="btn sq hold" id="clearBtn" type="button" aria-label="Start over"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
</header>

<nav id="tools" aria-label="Tools">
  <button class="tool on" data-tool="paint" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 3l3 3-9 9-3-3z"/><path d="M9 12c-2 0-4 1.5-4 4 0 1.5-1 2.5-2 3 3 1 7 0 8-3"/></svg>Paint</button>
  <button class="tool" data-tool="rainbow" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 18a9.5 9.5 0 0 1 19 0" stroke="#FF4D4D"/><path d="M6 18a6 6 0 0 1 12 0" stroke="#FFB000"/><path d="M9.5 18a2.5 2.5 0 0 1 5 0" stroke="#3A6FF7"/></svg>Rainbow</button>
  <button class="tool" data-tool="fill" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l7-7 7 7-7 7z"/><path d="M4 11h14"/><path d="M20 14s2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4z"/></svg>Fill</button>
  <button class="tool" data-tool="shapes" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5"/><rect x="11" y="11" width="10" height="10" rx="1.5"/></svg>Shapes</button>
  <button class="tool" data-tool="stickers" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12,2 15,8 22,9 16,13 18,20 12,16 6,20 8,13 2,9 9,8"/></svg>Stickers</button>
  <button class="tool" data-tool="eraser" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20h12"/><path d="M4 15l9-9 6 6-7 7H8z"/><path d="M9 10l6 6"/></svg>Eraser</button>
</nav>

<main id="stage">
  <div id="paper">
    <canvas id="paint"></canvas>
    <canvas id="lines"></canvas>
    <canvas id="prev" aria-label="Drawing paper"></canvas>
    <button class="letbtn" id="letBtn" type="button" hidden><svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 4l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z"/><path d="M40 34l2 5M8 34l-2 5M24 42v4"/></svg><span id="letLabel">Let it swim</span></button>
  </div>
</main>

<footer>
  <div id="colors" role="group" aria-label="Colors"></div>
  <div class="div"></div>
  <div id="opts"></div>
</footer>

<div class="ov" id="picsOv">
  <div class="card">
    <div class="cardtop"><h2>Play or pick a picture</h2><button class="close" type="button" data-close aria-label="Close"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>
    <div class="playrow">
      <button class="play" type="button" data-scene="aquarium" style="background:#2EC4B6"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 24c6-9 16-12 26-6l10-7v26l-10-7c-10 6-20 3-26-6z"/><circle cx="15" cy="22" r="1.6" fill="currentColor"/></svg>Aquarium</button>
      <button class="play" type="button" data-scene="track" style="background:#FF4D4D"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 33V27q0-4 4-4l7-1 5-8h10l4 8 7 2q2 1 2 4v5z"/><circle cx="14" cy="34" r="4.5"/><circle cx="35" cy="34" r="4.5"/></svg>Race Track</button>
      <button class="play" type="button" data-scene="arena" style="background:#FF9F1C"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 27h38v-6H33l-5-8h-9v8H5z"/><circle cx="13" cy="35" r="7"/><circle cx="35" cy="35" r="7"/></svg>Monster Trucks</button>
      <button class="play" type="button" data-scene="stage" style="background:#8E5CF7"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="10" r="4"/><path d="M17 4q-2 10 7 12 9-2 7-12"/><path d="M11 27q13-8 26 0-13 7-26 0z"/><path d="M22 30l-1 13M26 30l1 13"/></svg>Ballet</button>
      <button class="play" type="button" data-scene="garden" style="background:#FF70A6"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="11" r="4"/><path d="M21 17h6l4 16H17z"/><path d="M21 19C12 6 3 12 8 20c3 4 9 3 13 1M27 19c9-13 18-7 13 1-3 4-9 3-13 1"/></svg>Fairies</button>
    </div>
    <h3 class="sub">Color a picture</h3>
    <div id="pageGrid"></div>
  </div>
</div>

<div class="ov" id="saveOv">
  <div class="card center small" style="max-width:760px">
    <h2>Great picture!</h2>
    <img id="saveImg" alt="Your picture">
    <div class="tip"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v1a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-3-5a2 2 0 0 1 3.4-2L9 14"/></svg><span id="saveTip">Press and hold your picture, then tap Save to Photos.</span></div>
    <div class="row">
      <button class="btn go big" type="button" id="shareBtn" hidden>Save to Photos</button>
      <button class="btn big" type="button" data-close>Keep painting</button>
      <button class="btn big hold" type="button" id="newFromSave">New picture</button>
    </div>
  </div>
</div>

<div class="ov" id="whoOv">
  <div class="card center small">
    <h2>Who's painting?</h2>
    <div class="who">
      <button class="kid" type="button" data-kid="Adeline" style="background:#FF70A6">Adeline</button>
      <button class="kid" type="button" data-kid="Pierce" style="background:#3A6FF7">Pierce</button>
    </div>
    <div class="setrow"><span>Sounds</span><button class="btn" type="button" id="soundBtn">On</button></div>
    <div class="fine">Grown-ups: press and hold the name at the top for 2 seconds to come back here.</div>
  </div>
</div>

<div class="ov scene" id="sceneOv">
  <div class="scenewrap">
    <div class="scenetop">
      <button class="btn" id="sceneBack" type="button"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back to painting</button>
      <b id="sceneTitle"></b>
      <span id="scenePill"></span>
    </div>
    <div id="sceneBox"><canvas id="sceneCv" aria-label="Play scene"></canvas></div>
  </div>
</div>

<div id="bubble" role="status"></div>

<script>
(() => {
'use strict';
// The paper fills the drawing area of a landscape iPad. Its shape is worked out once
// and remembered, so a picture never gets squashed when the iPad is turned.
const H = 1200;
let W = 1600;   // set for real at start-up, once the toolbars are laid out
const LINE = '#1F1A2E';
const $ = (s) => document.querySelector(s);
const paint = $('#paint'), lines = $('#lines'), prev = $('#prev');
const pc = paint.getContext('2d', { willReadFrequently: true });
const lc = lines.getContext('2d', { willReadFrequently: true });
const vc = prev.getContext('2d');

/* ---------- small shape builders, in a 200 x 150 coloring-page space ---------- */
const C = (cx, cy, r) => `M${cx - r} ${cy}A${r} ${r} 0 1 0 ${cx + r} ${cy}A${r} ${r} 0 1 0 ${cx - r} ${cy}Z`;
const E = (cx, cy, rx, ry, deg = 0) => {
  const a = deg * Math.PI / 180, dx = rx * Math.cos(a), dy = rx * Math.sin(a);
  return `M${cx + dx} ${cy + dy}A${rx} ${ry} ${deg} 1 0 ${cx - dx} ${cy - dy}A${rx} ${ry} ${deg} 1 0 ${cx + dx} ${cy + dy}Z`;
};
const R = (x, y, w, h) => `M${x} ${y}h${w}v${h}h${-w}Z`;
const P = (s) => 'M' + s.trim().split(/\s+/).join('L') + 'Z';
const FAIRY = {
  wingUL: 'M92.53 56 C72 30 50 42 62 58 C70 68 84 66 91.11 62 Z',
  wingLL: 'M90.63 64 C76 62 66 74 72 82 C78 88 86 78 89.21 70 Z',
  wingUR: 'M107.47 56 C128 30 150 42 138 58 C130 68 116 66 108.89 62 Z',
  wingLR: 'M109.37 64 C124 62 134 74 128 82 C122 88 114 78 110.79 70 Z',
  dress: 'M93 54 H107 L116 92 Q100 98 84 92 Z',
  armL: 'M94 55.5 Q91.5 66 99 71.5 L100.5 69.5 Q95.5 65 97 55.5 Z',
  armR: 'M106 55.5 Q108.5 66 101 71.5 L99.5 69.5 Q104.5 65 103 55.5 Z',

// Coloring pages are drawn 4:3 in the middle of the wider paper. Ground and road
// lines that run edge to edge on the 4:3 drawing are carried out to the paper's
// edges, so the fill bucket still stops at them.
function drawPageOnPaper(ctx, page) {
  const s = H / 150, ox = (W - 200 * s) / 2;
  ctx.save();
  ctx.translate(ox, 0);
  drawPage(ctx, page, s, 1.3);
  ctx.restore();
  ctx.save();
  ctx.lineWidth = 1.3 * s; ctx.strokeStyle = LINE; ctx.lineCap = 'round';
  page.paths.forEach((d) => {
    if (!d.startsWith('M-5 ')) return;
    const y0 = parseFloat(d.slice(4));
    const nums = d.match(/-?\d+(\.\d+)?/g).map(Number);
    const y1 = /H205$/.test(d) ? y0 : nums[nums.length - 1];
    ctx.beginPath();
    ctx.moveTo(0, y0 * s); ctx.lineTo(ox + (-5) * s, y0 * s);
    ctx.moveTo(ox + 205 * s, y1 * s); ctx.lineTo(W, y1 * s);
    ctx.stroke();
  });
  ctx.restore();
}
function drawPage(ctx, page, scale, lw) {
  ctx.save();
  ctx.scale(scale, scale);
  ctx.lineWidth = lw;
  ctx.strokeStyle = LINE;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  page.paths.forEach((d) => ctx.stroke(new Path2D(d)));
  ctx.restore();
}

function drawIcon(ctx, parts, cx, cy, r, color) {
  const s = r / 11;
  ctx.save();
  ctx.translate(cx - 12 * s, cy - 12 * s);
  ctx.scale(s, s);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  parts.forEach((p) => {
    const path = p2d(p.d);
    if (p.fill || color) { ctx.fillStyle = color || p.fill; if (!p.w) ctx.fill(path); }
    if (p.stroke) { ctx.strokeStyle = p.stroke; ctx.lineWidth = p.w || 1; ctx.stroke(path); }
  });
  ctx.restore();
}

function iconSvg(parts, color, size) {
  const els = parts.map((p) => {
    const f = p.w ? 'none' : (color || p.fill || 'none');
    const st = p.stroke ? ` stroke="${p.stroke}" stroke-width="${p.w || 1}" stroke-linecap="round" stroke-linejoin="round"` : '';
    return `<path d="${p.d}" fill="${f}"${st}/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${els}</svg>`;
}

let AC = null;
function audio() {
  try {
    if (!AC) { const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return null; AC = new Ctx(); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }
  return AC;
}
function tone(f1, f2, dur, type, vol, delay) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, f1, f2, vol) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t);
}

const bubble = $('#bubble');
let bubbleTimer = 0;
function tip(el, text) {
  const r = el.getBoundingClientRect();
  bubble.textContent = text;
  bubble.classList.add('show');
  const bw = bubble.offsetWidth;
  bubble.style.left = Math.max(8, Math.min(window.innerWidth - bw - 8, r.left + r.width / 2 - bw / 2)) + 'px';
  bubble.style.top = (r.bottom + 10 + 40 > window.innerHeight ? r.top - 50 : r.bottom + 10) + 'px';
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 1800);
}
function holdButton(el, ms, onDone, hint) {
  let t0 = 0, raf = 0, fired = false;
  const step = () => {
    const p = Math.min(1, (performance.now() - t0) / ms);
    el.style.setProperty('--p', p);
    if (p >= 1) { fired = true; t0 = 0; el.style.setProperty('--p', 0); onDone(); return; }
    raf = requestAnimationFrame(step);
  };
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    fired = false; t0 = performance.now();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(step);
  });
  const stop = () => {
    if (!t0) return;
    cancelAnimationFrame(raf); t0 = 0;
    el.style.setProperty('--p', 0);
    if (!fired && hint) { sfx('tick'); tip(el, hint); }
  };
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => el.addEventListener(ev, stop));
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

      `<button type="button" class="opt${i === S.size ? ' on' : ''}" data-size="${i}" aria-label="${s.label}"><span class="dot" style="width:${s.d}px;height:${s.d}px;background:${dot}"></span></button>`).join('');
  } else if (t === 'shapes') {
    html = Object.keys(SHAPES).map((k) =>
      `<button type="button" class="opt${k === S.shape ? ' on' : ''}" data-shape="${k}" aria-label="${k}">${iconSvg([{ d: SHAPES[k] }], S.color === '#FFFFFF' ? '#E8DCCB' : S.color, 30)}</button>`).join('');
  } else if (t === 'stickers') {
    html = Object.keys(STICKERS).map((k) =>
      `<button type="button" class="opt${k === S.sticker ? ' on' : ''}" data-sticker="${k}" aria-label="${k} sticker">${iconSvg(STICKERS[k], null, 34)}</button>`).join('');
  } else if (t === 'fill') {

}

/* ---------- paper ---------- */
function whitePaper() { pc.fillStyle = '#FFFFFF'; pc.fillRect(0, 0, W, H); }
function setPage(i) {
  S.page = i;

  drawPageOnPaper(lc, PAGES[i]);
  LD = lc.getImageData(0, 0, W, H).data;

}
function snap() {
  try {
    undoStack.push({ img: pc.getImageData(0, 0, W, H), page: S.page });
    if (undoStack.length > UNDO_MAX) undoStack.shift();
  } catch (e) {}
  $('#undoBtn').disabled = false;
}
function undo() {
  const d = undoStack.pop();
  if (d) {
    sfx('undo');
    if (d.page !== S.page) setPage(d.page);
    pc.putImageData(d.img, 0, 0);
    persist();
  }
  $('#undoBtn').disabled = undoStack.length === 0;
}
let persistTimer = 0;
function persist() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => store('paint', paint.toDataURL('image/png')), 700);
}

/* ---------- drawing ---------- */
const posOf = (e) => {
  const r = prev.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
};
let active = null, last = null, mid = null, start = null, lastP = null, hue = 0;

function brushStyle() {
  const s = SIZES[S.size];
  pc.lineCap = 'round';
  pc.lineJoin = 'round';
  pc.lineWidth = S.tool === 'eraser' ? s.w * 1.8 : s.w;
  const col = S.tool === 'eraser' ? '#FFFFFF' : S.tool === 'rainbow' ? `hsl(${hue},90%,55%)` : S.color;
  pc.strokeStyle = col;
  pc.fillStyle = col;
}
function seg(p) {
  const dx = p.x - last.x, dy = p.y - last.y;
  if (dx * dx + dy * dy < 2) return;
  const m = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
  if (S.tool === 'rainbow') { hue = (hue + 3) % 360; pc.strokeStyle = `hsl(${hue},90%,55%)`; }
  pc.beginPath();
  pc.moveTo(mid.x, mid.y);
  pc.quadraticCurveTo(last.x, last.y, m.x, m.y);
  pc.stroke();
  mid = m;
  last = p;
}
function itemRadius(p) {
  const base = 70;
  if (!p) return base;
  return Math.max(base, Math.hypot(p.x - start.x, p.y - start.y));
}
function drawItem(ctx, p) {
  const r = itemRadius(p);
  if (S.tool === 'shapes') drawIcon(ctx, [{ d: SHAPES[S.shape] }], start.x, start.y, r, S.color);
  else drawIcon(ctx, STICKERS[S.sticker], start.x, start.y, r, null);
}
const isBrush = () => S.tool === 'paint' || S.tool === 'rainbow' || S.tool === 'eraser';

prev.addEventListener('pointerdown', (e) => {
  if (active !== null) return;          // one finger at a time; ignores a resting palm
  e.preventDefault();
  const p = posOf(e);
  if (S.tool === 'fill') {
    snap();
    sfx('splash');
    flood(Math.round(p.x), Math.round(p.y), S.color);
    persist();
    return;
  }
  active = e.pointerId;
  try { prev.setPointerCapture(e.pointerId); } catch (err) {}
  snap();
  start = p; lastP = p;
  if (isBrush()) {
    brushStyle();
    last = p; mid = p;
    pc.beginPath();
    pc.arc(p.x, p.y, pc.lineWidth / 2, 0, Math.PI * 2);
    pc.fill();
  } else {
    vc.clearRect(0, 0, W, H);
    vc.globalAlpha = 0.75;
    drawItem(vc, null);
    vc.globalAlpha = 1;
  }
});
prev.addEventListener('pointermove', (e) => {
  if (e.pointerId !== active) return;
  e.preventDefault();
  if (isBrush()) {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    (evs.length ? evs : [e]).forEach((ev) => seg(posOf(ev)));
  } else {
    lastP = posOf(e);
    vc.clearRect(0, 0, W, H);
    vc.globalAlpha = 0.75;
    drawItem(vc, lastP);
    vc.globalAlpha = 1;
  }
});
function endStroke(e) {
  if (e.pointerId !== active) return;
  active = null;
  if (isBrush()) {
    if (last && mid) { pc.beginPath(); pc.moveTo(mid.x, mid.y); pc.lineTo(last.x, last.y); pc.stroke(); }
  } else {
    vc.clearRect(0, 0, W, H);
    drawItem(pc, lastP);
    sfx('stamp');
  }
  persist();
}
prev.addEventListener('pointerup', endStroke);

/* ---------- fill bucket ---------- */
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function flood(sx, sy, hex) {
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
  const img = pc.getImageData(0, 0, W, H), d = img.data, N = W * H;
  const wall = (p) => LD !== null && LD[p * 4 + 3] > 110;
  let p0 = sy * W + sx;
  if (wall(p0)) {                        // tapped right on a line: nudge to the nearest open pixel
    let found = -1;
    for (let r = 1; r <= 14 && found < 0; r++) {
      for (let a = 0; a < 16 && found < 0; a++) {
        const x = Math.round(sx + r * Math.cos(a * Math.PI / 8)), y = Math.round(sy + r * Math.sin(a * Math.PI / 8));
        if (x >= 0 && y >= 0 && x < W && y < H && !wall(y * W + x)) found = y * W + x;
      }
    }
    if (found < 0) return;
    p0 = found; sx = p0 % W; sy = (p0 / W) | 0;
  }
  const [r, g, b] = hexRgb(hex);
  const i0 = p0 * 4, sr = d[i0], sg = d[i0 + 1], sb = d[i0 + 2];
  if (Math.abs(sr - r) + Math.abs(sg - g) + Math.abs(sb - b) < 6) return;
  const TOL = 96;
  const seen = new Uint8Array(N);
  const ok = (p) => {
    if (seen[p] || wall(p)) return false;
    const i = p * 4;
    return Math.abs(d[i] - sr) + Math.abs(d[i + 1] - sg) + Math.abs(d[i + 2] - sb) <= TOL;
  };
  const stack = [sx, sy];
  while (stack.length) {
    const y = stack.pop();
    let x = stack.pop();
    let p = y * W + x;
    if (!ok(p)) continue;
    while (x > 0 && ok(p - 1)) { x--; p--; }
    let up = false, dn = false;
    while (x < W && ok(p)) {
      seen[p] = 1;
      if (y > 0) { if (ok(p - W)) { if (!up) { stack.push(x, y - 1); up = true; } } else up = false; }
      if (y < H - 1) { if (ok(p + W)) { if (!dn) { stack.push(x, y + 1); dn = true; } } else dn = false; }
      x++; p++;
    }
  }
  // grow the fill by 2px so no white fringe shows against lines and strokes
  for (let pass = 0; pass < 2; pass++) {
    const mark = pass + 2;
    for (let p = 0; p < N; p++) {
      if (seen[p] === 0 || seen[p] === mark) continue;
      const x = p % W;
      if (x > 0 && !seen[p - 1]) seen[p - 1] = mark;
      if (x < W - 1 && !seen[p + 1]) seen[p + 1] = mark;
      if (p >= W && !seen[p - W]) seen[p - W] = mark;
      if (p < N - W && !seen[p + W]) seen[p + W] = mark;
    }
  }
  for (let p = 0; p < N; p++) {
    if (seen[p]) { const i = p * 4; d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255; }
  }
  pc.putImageData(img, 0, 0);
}

const CUT_Q = 3;   // pixels per coloring-page unit in each cut-out piece
function cutOut(def) {
  const s = H / 150, ox = (W - 200 * s) / 2;
  const [bx, by, bw, bh] = def.box;
  const out = {};
  def.pieces.forEach((pc) => {
    const c = document.createElement('canvas');
    c.width = Math.ceil(bw * CUT_Q); c.height = Math.ceil(bh * CUT_Q);
    const x = c.getContext('2d');
    const toPage = () => x.setTransform(CUT_Q, 0, 0, CUT_Q, -bx * CUT_Q, -by * CUT_Q);
    if (pc.fill) {
      toPage();
      pc.fill.forEach((d) => x.fill(p2d(d)));
      x.globalCompositeOperation = 'source-in';        // keep the kid's colors only inside the shape
      x.setTransform(1, 0, 0, 1, 0, 0);
      x.drawImage(paint, ox + bx * s, by * s, bw * s, bh * s, 0, 0, c.width, c.height);
      x.globalCompositeOperation = 'source-over';
    }
    toPage();
    x.lineWidth = 1.3; x.strokeStyle = LINE; x.lineJoin = 'round'; x.lineCap = 'round';
    (pc.line || []).forEach((d) => x.stroke(p2d(d)));
    out[pc.n] = c.toDataURL('image/png');
  });
  return out;
}

/* saved friends live on this iPad (IndexedDB), so scenes work in airplane mode */
const memFriends = [];
let memId = 1;
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('paintpad', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('friends', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  const run = (mode, fn) => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction('friends', mode);
    const req = fn(t.objectStore('friends'));
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = () => rej(t.error);
  }));
  return {
    add: (rec) => run('readwrite', (st) => st.add(rec)).catch(() => { rec.id = memId++; memFriends.push(rec); return rec.id; }),
    all: () => run('readonly', (st) => st.getAll()).catch(() => memFriends.slice()),
    del: (id) => run('readwrite', (st) => st.delete(id)).catch(() => { const i = memFriends.findIndex((r) => r.id === id); if (i >= 0) memFriends.splice(i, 1); })
  };
})();

/* ---------- scene engine ---------- */
const SW = 1140, SH = 704;                        // every scene is laid out on this size and scaled to fit
const sceneOv = $('#sceneOv'), sceneCv = $('#sceneCv'), sx = sceneCv.getContext('2d');
let SC = null;                                     // the open scene
const seeded = (n) => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const smooth = (u) => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
const lerp = (a, b, u) => a + (b - a) * u;

function loadImg(src) {
  return new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}

async function openScene(key, newId) {
  const def = SCENES[key];
  const recs = (await DB.all()).filter((r) => r.scene === key).sort((a, b) => a.at - b.at);
  const extra = Math.max(0, recs.length - def.cap);
  const friends = [];
  for (let i = 0; i < recs.length; i++) {
    const r = recs[i];
    const imgs = {};
    for (const k of Object.keys(r.pieces)) imgs[k] = await loadImg(r.pieces[k]);
    friends.push({ id: r.id, kind: r.kind, imgs, seed: seeded(r.id), isNew: r.id === newId, leaving: i < extra, enterT: r.id === newId ? 0.4 : -99, leaveT: i < extra ? 0.2 : null, gone: false });
  }
  recs.slice(0, extra).forEach((r) => DB.del(r.id));   // the oldest are on their way out
  SC = { key, def, friends, t0: performance.now(), t: 0, prev: 0, tapAt: -99, tapX: 0, tapY: 0, st: {} };
  $('#sceneTitle').textContent = (kid ? kid + "'s " : '') + def.name;
  $('#scenePill').textContent = def.hint;
  $('#scenePill').style.background = '#FFFFFF';
  $('#scenePill').style.color = 'var(--soft)';
  sceneOv.classList.add('show');
  sizeScene();
  RENDER[key].init(SC);
  cancelAnimationFrame(SC.raf);
  const loop = (now) => {
    if (!SC) return;
    const t = (now - SC.t0) / 1000;
    SC.dt = Math.min(0.05, t - SC.t); SC.t = t;
    drawScene();
    SC.raf = requestAnimationFrame(loop);
  };
  SC.raf = requestAnimationFrame(loop);
}
function closeScene() {
  if (SC) cancelAnimationFrame(SC.raf);
  SC = null;
  sceneOv.classList.remove('show');
}
let sceneScale = 1, sceneDpr = 1;
function sizeScene() {
  const box = $('#sceneBox');
  const w = box.clientWidth, h = box.clientHeight;
  const s = Math.min(w / SW, h / SH);
  sceneCv.style.width = Math.floor(SW * s) + 'px';
  sceneCv.style.height = Math.floor(SH * s) + 'px';
  sceneDpr = Math.min(2, window.devicePixelRatio || 1);
  sceneScale = s * sceneDpr;
  sceneCv.width = Math.round(SW * sceneScale);
  sceneCv.height = Math.round(SH * sceneScale);
  if (SC) SC.bg = null;                            // backgrounds are redrawn at the new size
}
window.addEventListener('resize', () => { if (SC) sizeScene(); });

function cachedLayer(name, drawFn) {
  if (!SC.bg) SC.bg = {};
  if (!SC.bg[name]) {
    const c = document.createElement('canvas');
    c.width = sceneCv.width; c.height = sceneCv.height;
    const x = c.getContext('2d');
    x.setTransform(sceneScale, 0, 0, sceneScale, 0, 0);
    x.lineJoin = 'round'; x.lineCap = 'round';
    drawFn(x);
    SC.bg[name] = c;
  }
  sx.setTransform(1, 0, 0, 1, 0, 0);
  sx.drawImage(SC.bg[name], 0, 0);
  sx.setTransform(sceneScale, 0, 0, sceneScale, 0, 0);
}

function drawScene() {
  sx.setTransform(sceneScale, 0, 0, sceneScale, 0, 0);
  sx.lineJoin = 'round'; sx.lineCap = 'round';
  RENDER[SC.key].frame(SC, sx, SC.t);
  SC.friends = SC.friends.filter((f) => !f.gone);
  if (!SC.friends.length) {
    sx.fillStyle = 'rgba(255,255,255,0.9)';
    roundRect(sx, SW / 2 - 300, SH / 2 - 44, 600, 88, 30); sx.fill();
    sx.fillStyle = '#2B2340'; sx.font = '600 28px Fredoka, system-ui, sans-serif';
    sx.textAlign = 'center'; sx.textBaseline = 'middle';
    sx.fillText(SC.def.empty, SW / 2, SH / 2 + 2);
  }
  const boosting = SC.t - SC.tapAt < 2.6;
  const pill = $('#scenePill');
  const want = boosting ? SC.def.burst : SC.def.hint;
  if (pill.textContent !== want) {
    pill.textContent = want;
    pill.style.background = boosting ? SC.def.color : '#FFFFFF';
    pill.style.color = boosting ? '#FFFFFF' : 'var(--soft)';
  }
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

sceneCv.addEventListener('pointerdown', (e) => {
  if (!SC) return;
  e.preventDefault();
  const r = sceneCv.getBoundingClientRect();
  SC.tapX = (e.clientX - r.left) * SW / r.width;
  SC.tapY = (e.clientY - r.top) * SH / r.height;
  if (SC.t - SC.tapAt > 2.6 || SC.key === 'aquarium') SC.tapAt = SC.t;
  sfx('pop');
});
$('#sceneBack').addEventListener('click', () => { closeScene(); sfx('tool'); });

// draw a cut-out friend: (x, y) is where its anchor goes, k = scene pixels per coloring-page unit
function drawFriend(c, f, x, y, k, flip, rot, pose) {
  const def = SPRITES[f.kind];
  const [bx, by, bw, bh] = def.box, [ax, ay] = def.anchor;
  c.save();
  c.translate(x, y);
  if (rot) c.rotate(rot);
  c.scale(flip * k, k);
  c.translate(-ax, -ay);
  def.pieces.forEach((pc) => {
    const im = f.imgs[pc.n];
    if (!im) return;
    const p = pose && pose[pc.n];
    if (p) {
      const [px, py] = pc.pivot || def.anchor;
      c.save();
      c.translate(px, py);
      if (p.r) c.rotate(p.r);
      if (p.sx || p.sy) c.scale(p.sx || 1, p.sy || 1);
      c.translate(-px, -py);
      c.drawImage(im, bx, by, bw, bh);
      c.restore();
    } else c.drawImage(im, bx, by, bw, bh);
  });
  c.restore();
}
const pathCache2 = {};
const P2 = (d) => pathCache2[d] || (pathCache2[d] = new Path2D(d));
function shape(c, d, fill, stroke, lw) {
  const p = P2(d);
  if (fill) { c.fillStyle = fill; c.fill(p); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 4; c.stroke(p); }
}
const PARTY = ['#FF4D4D', '#FFD60A', '#3A6FF7', '#8AC926', '#FF70A6', '#FF9F1C', '#8E5CF7', '#2EC4B6'];
function crowd(c, t, y0, cheer, count) {
  for (let row = 0; row < 3; row++) {
    for (let i = 0; i < count; i++) {
      const jump = cheer ? Math.max(0, 9 * Math.sin(t * 14 + i * 1.3 + row)) : Math.max(0, 2 * Math.sin(t * 3 + i + row));
      c.beginPath();
      c.arc(14 + i * (SW / (count - 0.5)) + (row % 2) * 22, y0 + row * 30 - jump, 10.5, 0, Math.PI * 2);
      c.fillStyle = PARTY[(i * 3 + row * 5) % 8]; c.fill();
      c.lineWidth = 3; c.strokeStyle = LINE; c.stroke();
    }
  }
}
const starPath = (x, y, r1, r2) => {
  let d = '';
  for (let k = 0; k < 10; k++) { const r = k % 2 ? r2 : r1, a = -Math.PI / 2 + k * Math.PI / 5; d += (k ? 'L' : 'M') + (x + r * Math.cos(a)).toFixed(1) + ' ' + (y + r * Math.sin(a)).toFixed(1); }
  return d + 'Z';
};

const RENDER = {};

/* ----- aquarium ----- */
RENDER.aquarium = {
  init(S) { S.st.bubbles = []; },
  pos(f, i, t, S) {
    const sp = 0.2 + 0.2 * seeded(f.id + 1), ph = seeded(f.id + 2) * 6.28;

      const e = smooth(w), a = i * 1.05 + t * 0.6;
      const ty = Math.min(560, Math.max(90, S.tapY));
      x = lerp(x, S.tapX + Math.cos(a) * (70 + i * 10), e);
      y = lerp(y, ty + Math.sin(a) * (40 + i * 6), e);

    if (t < f.enterT + 3.2) { const u = smooth((t - f.enterT) / 3.2); x = lerp(1320, x, u); y = lerp(y0, y, u); }

      c.save(); c.translate(x, 640); c.rotate(0.09 * Math.sin(t * 1.1 + i));
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-26, -h / 3, 0, -h / 2); c.quadraticCurveTo(26, -2 * h / 3, 0, -h);
      c.strokeStyle = col; c.lineWidth = 14; c.stroke(); c.restore();
    });

    shape(c, 'M254 650 A46 22 0 1 0 346 650 A46 22 0 1 0 254 650Z', '#8D8D99', LINE, 5);

    for (let i = 0; i < 9; i++) {
      const k = (t * (0.08 + (i % 3) * 0.03) + i * 0.137) % 1;

  frame(S, c, t) {
    cachedLayer('back', (b) => {
      b.fillStyle = '#2E2A6B'; b.fillRect(0, 0, SW, SH);
      b.fillStyle = '#3E3585'; b.fillRect(0, 300, SW, SH);
      shape(b, 'M1000 90 A46 46 0 1 0 1092 90 A46 46 0 1 0 1000 90Z', '#FFF3B0', LINE, 4);
      shape(b, 'M1050 70 A10 10 0 1 0 1070 70 A10 10 0 1 0 1050 70Z M1022 104 A7 7 0 1 0 1036 104 A7 7 0 1 0 1022 104Z', '#F2E08C');
      shape(b, 'M-10 560 Q 200 470 420 540 T 820 520 T 1150 500 V720 H-10Z', '#2A9D55', LINE, 4);
      shape(b, 'M-10 610 Q 300 560 600 600 T 1150 590 V720 H-10Z', '#3FB86A', LINE, 4);
      // mushrooms
      [[180, 640, 1], [930, 625, 1.3], [1010, 650, 0.8]].forEach(([x, y, k]) => {
        shape(b, `M${x - 12 * k} ${y} V${y - 34 * k} H${x + 12 * k} V${y}Z`, '#FFF4E6', LINE, 4);
        shape(b, `M${x - 46 * k} ${y - 30 * k} Q${x} ${y - 100 * k} ${x + 46 * k} ${y - 30 * k}Z`, '#FF4D4D', LINE, 4);
        shape(b, `M${x - 20 * k} ${y - 52 * k} A7 7 0 1 0 ${x - 6 * k} ${y - 52 * k} A7 7 0 1 0 ${x - 20 * k} ${y - 52 * k}Z M${x + 10 * k} ${y - 44 * k} A6 6 0 1 0 ${x + 22 * k} ${y - 44 * k} A6 6 0 1 0 ${x + 10 * k} ${y - 44 * k}Z`, '#FFFFFF');
      });
      // flowers
      [[90, 600, '#FF70A6'], [330, 610, '#FFD60A'], [520, 630, '#8E5CF7'], [700, 600, '#FF9F1C'], [800, 640, '#4CC9F0']].forEach(([x, y, col]) => {
        b.strokeStyle = LINE; b.lineWidth = 4; b.beginPath(); b.moveTo(x, y + 60); b.lineTo(x, y); b.stroke();
        for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; shape(b, `M${x + 16 * Math.cos(a) - 11} ${y + 16 * Math.sin(a)} A11 11 0 1 0 ${x + 16 * Math.cos(a) + 11} ${y + 16 * Math.sin(a)} A11 11 0 1 0 ${x + 16 * Math.cos(a) - 11} ${y + 16 * Math.sin(a)}Z`, col, LINE, 3); }
        shape(b, `M${x - 9} ${y} A9 9 0 1 0 ${x + 9} ${y} A9 9 0 1 0 ${x - 9} ${y}Z`, '#FFD60A', LINE, 3);
      });
    });
    for (let i = 0; i < 26; i++) {                               // twinkling stars
      const x = (i * 263) % 1100 + 20, y = (i * 137) % 260 + 20;
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * (1 + (i % 4) * 0.4) + i));
      c.globalAlpha = tw; shape(c, starPath(x, y, 6 + (i % 3) * 2, 2.6), '#FFF3B0'); c.globalAlpha = 1;
    }
    for (let i = 0; i < 12; i++) {                               // fireflies
      const x = 100 + ((i * 331) % 940) + 30 * Math.sin(t * 0.7 + i), y = 430 + ((i * 97) % 160) + 20 * Math.sin(t * 1.1 + i * 2);
      c.beginPath(); c.arc(x, y, 4, 0, Math.PI * 2);
      c.fillStyle = 'rgba(255,240,140,' + (0.3 + 0.7 * Math.abs(Math.sin(t * 2 + i))).toFixed(2) + ')'; c.fill();
    }
    const age = t - S.tapAt;
    if (age >= 0 && age < 2.4) {                                 // fairy dust burst where they tapped
      for (let i = 0; i < 18; i++) {
        const a = i * 0.349 + age, r = age * (110 + (i % 4) * 30);
        c.save(); c.globalAlpha = Math.max(0, 1 - age / 2.4);
        c.translate(S.tapX + Math.cos(a) * r, S.tapY + Math.sin(a) * r + age * age * 30); c.rotate(age * 4 + i);
        shape(c, starPath(0, 0, 10, 4), PARTY[i % 8], LINE, 1.5); c.restore();
      }
    }
    S.friends.forEach((f, i) => {
      const p = this.pos(f, i, t, S), q = this.pos(f, i, t - 0.06, S);
      const vx = (p.x - q.x) / 0.06;
      f.trail = f.trail || [];
      f.trail.push({ x: p.x + (Math.random() - 0.5) * 20, y: p.y + 40 + (Math.random() - 0.5) * 20, t, c: PARTY[(i + f.trail.length) % 8] });
      while (f.trail.length && t - f.trail[0].t > 1.1) f.trail.shift();
      f.trail.forEach((d, j) => {
        if (j % 2) return;
        const life = 1 - (t - d.t) / 1.1;
        c.save(); c.globalAlpha = life; c.translate(d.x, d.y + (1 - life) * 30);
        shape(c, starPath(0, 0, 4 + 5 * life, 2), j % 4 ? '#FFF3B0' : d.c); c.restore();
      });
      const k = 1.45 + 0.4 * seeded(f.id + 10);
      const flap = Math.abs(Math.sin(t * 9 + i * 1.7));
      const tilt = Math.max(-0.3, Math.min(0.3, vx * 0.0011));
      const bobY = 8 * Math.sin(t * 3 + i);
      drawFriend(c, f, p.x, p.y + bobY, k, 1, tilt, {
        wingL: { sx: 0.45 + 0.55 * flap }, wingR: { sx: 0.45 + 0.55 * flap },
        legL: { r: 0.18 * Math.sin(t * 2.4 + i) }, legR: { r: 0.18 * Math.sin(t * 2.4 + i + 1.2) }
      });
    });
  }
};

/* ----- ballet stage ----- */
RENDER.stage = {
  init(S) {},
  homes(n) {
    if (n <= 1) return [570];
    const gap = Math.min(250, 560 / (n - 1));
    return Array.from({ length: n }, (_, i) => 570 - gap * (n - 1) / 2 + gap * i);
  },
  frame(S, c, t) {
    cachedLayer('back', (b) => {
      b.fillStyle = '#3B2A5C'; b.fillRect(0, 0, SW, SH);
      shape(b, 'M0 520 H1140 V704 H0Z', '#C98B5A', LINE, 4);
      b.strokeStyle = '#A86F43'; b.lineWidth = 3; b.stroke(P2('M0 560 H1140 M0 610 H1140 M0 664 H1140 M190 520 L160 704 M420 520 L410 704 M720 520 L730 704 M950 520 L980 704'));
    });
    [210, 360, 480, 660, 780, 930, 1000].forEach((x, i) => {
      const y = 110 + (i % 3) * 40;
      c.strokeStyle = '#B9A8E0'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, 46); c.lineTo(x, y - 16); c.stroke();
      c.save(); c.translate(x, 46); c.rotate(0.14 * Math.sin(t * 1.3 + i)); c.translate(-x, -46);
      shape(c, starPath(x, y, 16, 7), '#FFD60A', LINE, 3); c.restore();
    });
    const live = S.friends;
    const homes = this.homes(live.filter((f) => !f.leaving).length);
    let hi = 0;
    const since = t - S.tapAt, show = since >= 0 && since < 3.6;
    const plan = live.map((f, i) => {
      const home = f.leaving ? (f.home || 570) : homes[hi++];
      f.home = home;
      const ph = seeded(f.id + 5) * 6.28, dir = home < 570 ? 1 : home > 570 ? -1 : (i % 2 ? -1 : 1);
      const sway = 50 * Math.sin(0.55 * t + ph);
      let bob = 10 * Math.abs(Math.sin(1.9 * t + ph)), spin = 0, lift = 0, dx = 0, tilt = 0, split = 0, arms = null;
      const own = (t + ph * 1.7) % 7;
      const leap = (u, dist) => { const e = Math.sin(Math.PI * u); lift = 120 * e; dx = dist * u; bob = 0; split = Math.min(1, e * 1.6) * (dist >= 0 ? 1 : -1); tilt = -0.1 * e * (dist >= 0 ? 1 : -1); arms = 1; };
      if (own < 1.3) { const u = own / 1.3; spin = u * 720; lift = 26 * Math.sin(Math.PI * u); }
      if (own >= 3.4 && own < 4.5) leap((own - 3.4) / 1.1, 120 * dir);
      else if (own >= 4.5 && own < 6.0) { const v = (own - 4.5) / 1.5; dx = 120 * dir * (1 - smooth(v)); }
      if (show && !f.leaving) {
        spin = 0; lift = 0; dx = 0; tilt = 0; split = 0; arms = null;
        if (since < 1.1) leap(since / 1.1, 0);
        else if (since >= 1.2) { const u = Math.min(1, (since - 1.2) / 2.2); spin = u * 1080; lift = 46 * Math.sin(Math.PI * u); arms = 0; bob = 0; }
      }
      let x = home + sway + dx;
      if (t < f.enterT + 2.6) { const u = smooth((t - f.enterT) / 2.6); x = lerp(1260, x, u); spin = 0; }    // walks on from the right
      if (f.leaving && t > f.leaveT) {                         // bows, then glides off to the left
        const u = t - f.leaveT;
        spin = 0; lift = 0; split = 0; arms = 0;
        if (u < 1.2) tilt = 0.45 * Math.sin(Math.PI * u / 1.2);
        else { x = lerp(x, -260, smooth((u - 1.2) / 2.2)); if (u > 3.4) f.gone = true; }
      }
      const sxv = Math.cos(spin * Math.PI / 180);
      const flip = Math.abs(sxv) < 0.12 ? (sxv < 0 ? -0.12 : 0.12) : sxv;
      const wave = Math.sin(2.1 * t + ph);
      const aL = arms === 1 ? -95 : arms === 0 ? -8 : -30 + 28 * wave;
      const aR = arms === 1 ? 95 : arms === 0 ? 8 : 30 - 28 * Math.sin(2.1 * t + ph + 1.4);
      return { f, x, y: 630 - bob - lift, flip, tilt, pose: {
        armL: { r: aL * Math.PI / 180 }, armR: { r: aR * Math.PI / 180 },
        legL: { r: 62 * split * Math.PI / 180 }, legR: { r: -62 * split * Math.PI / 180 },
        tutu: { sx: 1 + 0.06 * Math.sin(5 * t + i), sy: 1 - 0.08 * Math.sin(5 * t + i) }
      } };
    });
    plan.forEach((p) => { c.fillStyle = 'rgba(255,243,176,0.16)'; c.fill(P2(`M${(p.x - 40).toFixed(0)} 0 L${(p.x + 40).toFixed(0)} 0 L${(p.x + 125).toFixed(0)} 618 L${(p.x - 125).toFixed(0)} 618Z`)); });
    plan.forEach((p) => { c.beginPath(); c.ellipse(p.x, 618, 120, 26, 0, 0, Math.PI * 2); c.fillStyle = 'rgba(255,243,176,0.35)'; c.fill(); });
    for (let i = 0; i < 4; i++) {
      const k = (t * 0.16 + i * 0.25) % 1, x = 260 + i * 200 + 30 * Math.sin(t * 1.5 + i), y = 500 - k * 360;
      const o = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85 * 0.9;
      c.save(); c.globalAlpha = o; c.translate(x, y);
      c.strokeStyle = '#FFFFFF'; c.lineWidth = 3.5; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -26); c.lineTo(16, -30); c.lineTo(16, -6); c.stroke();
      c.fillStyle = '#FFFFFF'; c.beginPath(); c.ellipse(-4, 0, 5.5, 4.5, 0, 0, Math.PI * 2); c.ellipse(12, -6, 5.5, 4.5, 0, 0, Math.PI * 2); c.fill();
      c.restore();
    }
    plan.forEach((p) => drawFriend(c, p.f, p.x, p.y, 2.6, p.flip, p.tilt, p.pose));
    if (show && since > 1.0) {
      const st = since - 1.0;
      for (let i = 0; i < 22; i++) {
        c.save(); c.translate(180 + ((i * 397) % 800), -20 + st * (180 + (i % 5) * 40) - (i % 4) * 60); c.rotate((st * 3.5 + i * 0.7) % 6.28);
        shape(c, starPath(0, 0, 14, 6), ['#FFD60A', '#FF70A6', '#FFFFFF', '#8E5CF7', '#4CC9F0'][i % 5], LINE, 2); c.restore();
      }
    }
    cachedLayer('front', (b) => {
      shape(b, 'M0 0 H150 Q130 200 160 400 Q140 560 170 704 H0 Z', '#D63A4A', LINE, 4);
      b.strokeStyle = '#A82434'; b.lineWidth = 5; b.stroke(P2('M40 0 Q30 300 50 704 M95 0 Q80 300 105 704 M1100 0 Q1110 300 1090 704 M1045 0 Q1060 300 1035 704'));
      shape(b, 'M1140 0 H990 Q1010 200 980 400 Q1000 560 970 704 H1140 Z', '#D63A4A', LINE, 4);
      b.strokeStyle = '#A82434'; b.stroke(P2('M1100 0 Q1110 300 1090 704 M1045 0 Q1060 300 1035 704'));
      let d = 'M0 0 H1140 V46';
      for (let x = 1140; x > 0; x -= 57) d += ` Q${x - 28.5} 76 ${x - 57} 46`;
      shape(b, d + ' Z', '#D63A4A', LINE, 4);
      b.strokeStyle = '#FFD60A'; b.lineWidth = 6; b.stroke(P2('M0 20 H1140'));
    });
  }
};

/* ---------- the Let it... button and the Play row ---------- */
const letBtn = $('#letBtn');
function showLetButton() {
  const sp = SPRITES[PAGES[S.page].name];
  letBtn.hidden = !sp;
  if (sp) { $('#letLabel').textContent = SCENES[sp.scene].verb; letBtn.style.background = SCENES[sp.scene].color; }
}
letBtn.addEventListener('click', async () => {
  const name = PAGES[S.page].name, sp = SPRITES[name];
  if (!sp || letBtn.disabled) return;
  letBtn.disabled = true;
  try {
    const pieces = cutOut(sp);
    const id = await DB.add({ scene: sp.scene, kind: name, pieces, at: Date.now() });
    sfx('chime');
    await openScene(sp.scene, id);
  } finally { letBtn.disabled = false; }
});
document.querySelectorAll('[data-scene]').forEach((b) => b.addEventListener('click', () => {
  hideAll();
  sfx('tool');
  openScene(b.dataset.scene, null);
}));

/* ---------- start ---------- */
function paperWidth() {
  let a = NaN;
  try { a = parseFloat(localStorage.getItem('paintpad.paper')); } catch (e) {}
  if (!(a >= 4 / 3 && a <= 2.3)) {
    const r = document.getElementById('stage').getBoundingClientRect();
    if (r.width >= r.height && r.height > 0) a = r.width / r.height;
    else {
      const long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
      a = (long - 160) / (short - 200);   // tool rail, header and color bar taken out
    }
    a = Math.min(2.3, Math.max(4 / 3, a));
    try { localStorage.setItem('paintpad.paper', a.toFixed(4)); } catch (e) {}
  }
  return Math.round(H * a);
}
W = paperWidth();
[paint, lines, prev].forEach((c) => { c.width = W; c.height = H; });
whitePaper();
// saved by name; older versions saved a position in the original list
const OLD_ORDER = ['Blank page', 'House', 'Fish', 'Flower', 'Rocket', 'Butterfly', 'Car', 'Cat'];
let savedName = load('page') || 'Blank page';
if (/^\d+$/.test(savedName)) savedName = OLD_ORDER[+savedName] || 'Blank page';
const savedIdx = PAGES.findIndex((pg) => pg.name === savedName);
setPage(savedIdx >= 0 ? savedIdx : 0);
const savedPaint = load('paint');
if (savedPaint) {
  const im = new Image();
  im.onload = () => {
    // a picture saved before the paper got wider sits in the middle at its old size
    const w = im.width * H / im.height;
    pc.drawImage(im, (W - w) / 2, 0, w, H);
  };
  im.src = savedPaint;
}
$('#undoBtn').disabled = true;
renderOpts();
fit();
showName();
showSound();
if (!kid) show('#whoOv');

// keep a copy on the iPad so the app opens with no connection (airplane mode)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
