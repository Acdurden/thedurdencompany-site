<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paint Pad">
<meta name="theme-color" content="#FFF4E6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Paint Pad</title>
<style>
/* Fredoka font, stored with the app (SIL Open Font License, see fonts/OFL-LICENSE.txt) */
@font-face{font-family:'Fredoka';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/fredoka-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
:root{--ink:#2B2340;--soft:#5B5170;--bg:#FFF4E6;--line:#F1E6D6;--pick:#FFE9A8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{
  position:fixed;inset:0;
  font-family:'Fredoka',system-ui,-apple-system,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "tools stage" "bottom bottom";
  gap:14px;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
button{font-family:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
svg{display:block}
header{grid-area:top;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:default}
.brand b{font-size:30px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.btn{height:56px;padding:0 18px;border:0;border-radius:18px;background:#fff;box-shadow:0 3px 0 rgba(43,35,64,.14);display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
.btn:active,.tool:active,.opt:active,.sw:active{transform:translateY(2px)}
.btn.go{background:#2A9D55;color:#fff;box-shadow:0 3px 0 rgba(20,80,40,.35)}
.btn.sq{width:56px;padding:0;justify-content:center}
.btn:disabled{opacity:.4}
#tools{grid-area:tools;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
.tool{width:92px;height:88px;flex:none;border-radius:24px;border:4px solid #fff;background:#fff;box-shadow:0 3px 0 rgba(43,35,64,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:15px;font-weight:600}
.tool.on{border-color:var(--ink);background:var(--pick)}
#stage{grid-area:stage;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden}
#paper{position:relative;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 6px 0 rgba(43,35,64,.10)}
#paper canvas{position:absolute;inset:0;width:100%;height:100%}
#prev{touch-action:none}
footer{grid-area:bottom;display:flex;align-items:center;gap:16px;background:#fff;border-radius:26px;padding:12px 18px;box-shadow:0 4px 0 rgba(43,35,64,.10)}
#colors{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;padding:0;box-shadow:0 0 0 2px #E8DCCB}
.sw.on{box-shadow:0 0 0 4px var(--ink)}
.div{width:3px;align-self:stretch;background:var(--line);border-radius:2px}
#opts{display:flex;align-items:center;gap:10px;min-width:300px}
#opts .lbl{font-size:15px;font-weight:600;color:var(--soft)}
#opts .hint{font-size:18px;font-weight:500;color:var(--soft);max-width:300px}
.opt{width:56px;height:56px;border-radius:18px;border:3px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.opt.on{border-color:var(--ink);background:var(--pick)}
.dot{display:block;border-radius:50%}
.ov{position:fixed;inset:0;z-index:20;background:rgba(43,35,64,.55);display:none;align-items:center;justify-content:center;padding:24px}
.ov.show{display:flex}
.card{background:#fff;border-radius:36px;padding:28px 32px 32px;width:100%;max-width:1040px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:20px;box-shadow:0 10px 0 rgba(43,35,64,.25)}
.card h2{margin:0;font-size:38px;font-weight:700}
.cardtop{display:flex;align-items:center;gap:16px}
.cardtop h2{flex:1}
.hold{position:relative;overflow:hidden}
.hold::after{content:'';position:absolute;left:0;bottom:0;height:7px;width:calc(var(--p,0) * 100%);background:#FF4D4D;border-radius:0 4px 4px 0}
#bubble{position:fixed;z-index:40;background:var(--ink);color:#fff;border-radius:14px;padding:9px 15px;font-size:17px;font-weight:500;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#bubble.show{opacity:1}
.who{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%}
.kid{height:170px;border-radius:30px;border:0;font-size:42px;font-weight:700;color:#fff !important;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.kid:active{transform:translateY(3px)}
.setrow{display:flex;gap:14px;justify-content:center;align-items:center;font-size:20px;font-weight:500}
.fine{font-size:15px;color:var(--soft)}
.close{width:60px;height:60px;border-radius:20px;border:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
#pageGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.pg{border:4px solid var(--line);border-radius:26px;background:#fff;padding:12px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:22px;font-weight:600}
.pg.blank{border-style:dashed;border-color:#D9CCB8}
.pg canvas{width:100%;aspect-ratio:4/3;height:auto}
.center{align-items:center;text-align:center}
#saveImg{max-width:100%;max-height:52vh;border-radius:22px;border:4px solid var(--line);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.tip{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:18px;padding:12px 18px;font-size:20px;font-weight:500}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.big{height:62px;padding:0 28px;font-size:21px;border-radius:20px}
.small{max-width:560px}
@media (max-width:900px){
  .brand b{font-size:24px}
  .btn .t{display:none}
  .btn{padding:0;width:56px;justify-content:center}
  footer{flex-wrap:wrap}
  .div{display:none}
  #opts{min-width:0}
}
@media (max-height:700px){.tool{height:74px;width:84px;font-size:13px}}
</style>
</head>
<body>

<header>
  <button class="brand" id="brand" type="button" aria-label="Paint Pad. Grown-ups: press and hold for settings">
    <svg width="48" height="48" viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="44" fill="#3A6FF7"/><g fill="none" stroke-width="18" stroke-linecap="round"><path d="M38 140 A62 62 0 0 1 162 140" stroke="#FF4D4D"/><path d="M60 140 A40 40 0 0 1 140 140" stroke="#FFD60A"/><path d="M82 140 A18 18 0 0 1 118 140" stroke="#FFFFFF"/></g></svg>
    <b id="title">Paint Pad</b>
  </button>
  <button class="btn" id="undoBtn" type="button" aria-label="Undo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="t">Undo</span></button>
  <button class="btn" id="picsBtn" type="button" aria-label="Pictures"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span class="t">Pictures</span></button>
  <button class="btn go" id="saveBtn" type="button" aria-label="Save"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span class="t">Save</span></button>
  <button class="btn sq hold" id="clearBtn" type="button" aria-label="Start over"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
</header>

<nav id="tools" aria-label="Tools">
  <button class="tool on" data-tool="paint" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 3l3 3-9 9-3-3z"/><path d="M9 12c-2 0-4 1.5-4 4 0 1.5-1 2.5-2 3 3 1 7 0 8-3"/></svg>Paint</button>
  <button class="tool" data-tool="rainbow" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 18a9.5 9.5 0 0 1 19 0" stroke="#FF4D4D"/><path d="M6 18a6 6 0 0 1 12 0" stroke="#FFB000"/><path d="M9.5 18a2.5 2.5 0 0 1 5 0" stroke="#3A6FF7"/></svg>Rainbow</button>
  <button class="tool" data-tool="fill" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l7-7 7 7-7 7z"/><path d="M4 11h14"/><path d="M20 14s2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4z"/></svg>Fill</button>
  <button class="tool" data-tool="shapes" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5"/><rect x="11" y="11" width="10" height="10" rx="1.5"/></svg>Shapes</button>
  <button class="tool" data-tool="stickers" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12,2 15,8 22,9 16,13 18,20 12,16 6,20 8,13 2,9 9,8"/></svg>Stickers</button>
  <button class="tool" data-tool="eraser" type="button"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20h12"/><path d="M4 15l9-9 6 6-7 7H8z"/><path d="M9 10l6 6"/></svg>Eraser</button>
</nav>

<main id="stage">
  <div id="paper">
    <canvas id="paint"></canvas>
    <canvas id="lines"></canvas>
    <canvas id="prev" aria-label="Drawing paper"></canvas>
  </div>
</main>

<footer>
  <div id="colors" role="group" aria-label="Colors"></div>
  <div class="div"></div>
  <div id="opts"></div>
</footer>

<div class="ov" id="picsOv">
  <div class="card">
    <div class="cardtop"><h2>Pick a picture to color</h2><button class="close" type="button" data-close aria-label="Close"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>
    <div id="pageGrid"></div>
  </div>
</div>

<div class="ov" id="saveOv">
  <div class="card center small" style="max-width:760px">
    <h2>Great picture!</h2>
    <img id="saveImg" alt="Your picture">
    <div class="tip"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v1a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-3-5a2 2 0 0 1 3.4-2L9 14"/></svg><span id="saveTip">Press and hold your picture, then tap Save to Photos.</span></div>
    <div class="row">
      <button class="btn go big" type="button" id="shareBtn" hidden>Save to Photos</button>
      <button class="btn big" type="button" data-close>Keep painting</button>
      <button class="btn big hold" type="button" id="newFromSave">New picture</button>
    </div>
  </div>
</div>

<div class="ov" id="whoOv">
  <div class="card center small">
    <h2>Who's painting?</h2>
    <div class="who">
      <button class="kid" type="button" data-kid="Adeline" style="background:#FF70A6">Adeline</button>
      <button class="kid" type="button" data-kid="Pierce" style="background:#3A6FF7">Pierce</button>
    </div>
    <div class="setrow"><span>Sounds</span><button class="btn" type="button" id="soundBtn">On</button></div>
    <div class="fine">Grown-ups: press and hold the name at the top for 2 seconds to come back here.</div>
  </div>
</div>

<div id="bubble" role="status"></div>

<script>
(() => {
'use strict';
// The paper fills the drawing area of a landscape iPad. Its shape is worked out once
// and remembered, so a picture never gets squashed when the iPad is turned.
const H = 1200;
const W = (() => {
  let a = NaN;
  try { a = parseFloat(localStorage.getItem('paintpad.aspect')); } catch (e) {}
  if (!(a >= 4 / 3 && a <= 2.3)) {
    const r = document.getElementById('stage').getBoundingClientRect();
    if (r.width >= r.height && r.height > 0) a = r.width / r.height;
    else {
      const long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
      a = (long - 160) / (short - 200);   // tool rail, header and color bar taken out
    }
    a = Math.min(2.3, Math.max(4 / 3, a));
    try { localStorage.setItem('paintpad.aspect', a.toFixed(4)); } catch (e) {}
  }
  return Math.round(H * a);
})();
const LINE = '#1F1A2E';
const $ = (s) => document.querySelector(s);
const paint = $('#paint'), lines = $('#lines'), prev = $('#prev');
[paint, lines, prev].forEach((c) => { c.width = W; c.height = H; });
const pc = paint.getContext('2d', { willReadFrequently: true });
const lc = lines.getContext('2d', { willReadFrequently: true });
const vc = prev.getContext('2d');

/* ---------- small shape builders, in a 200 x 150 coloring-page space ---------- */

const E = (cx, cy, rx, ry, deg = 0) => {
  const a = deg * Math.PI / 180, dx = rx * Math.cos(a), dy = rx * Math.sin(a);
  return `M${cx + dx} ${cy + dy}A${rx} ${ry} ${deg} 1 0 ${cx - dx} ${cy - dy}A${rx} ${ry} ${deg} 1 0 ${cx + dx} ${cy + dy}Z`;
};
const R = (x, y, w, h) => `M${x} ${y}h${w}v${h}h${-w}Z`;
const P = (s) => 'M' + s.trim().split(/\s+/).join('L') + 'Z';

const PAGES = [
  { name: 'Blank page', paths: [] },
  { name: 'Princess', paths: [
    C(100, 42, 14), P('88,31 89,17 95,24 100,13 105,24 111,17 112,31'), C(100, 19, 2.5),

    P('36,30 39,37 46,37 40,41 42,48 36,44 30,48 32,41 26,37 33,37'), P('168,96 170,101 175,101 171,104 172,109 168,106 164,109 165,104 161,101 166,101'),
    'M30 100 Q24 92 30 88 Q36 84 40 92 Q44 84 50 88 Q56 92 50 100 L40 110 Z'
  ] },
  { name: 'Castle', paths: [
    'M-5 136 Q100 128 205 136', R(60, 70, 80, 63), R(40, 50, 24, 83), P('36,50 52,22 68,50'), R(136, 50, 24, 83), P('132,50 148,22 164,50'),
    R(88, 40, 24, 30), P('84,40 100,12 116,40'), 'M88 133 V110 Q100 96 112 110 V133', 'M100 102 V133',
    R(47, 66, 10, 14), R(143, 66, 10, 14), C(100, 55, 5), R(70, 82, 10, 12), R(120, 82, 10, 12),
    'M52 22 V10', P('52,10 63,13 52,16'), 'M148 22 V10', P('148,10 159,13 148,16'), 'M100 12 V3', P('100,3 109,6 100,9'),
    C(182, 24, 10), 'M10 30 Q18 20 28 26 Q36 16 46 26 Q56 26 52 34 H12 Q4 34 10 30Z'
  ] },
  { name: 'Crown', paths: [
    P('40,108 40,50 70,80 100,34 130,80 160,50 160,108'), R(40, 108, 120, 22),
    C(40, 45, 6), C(100, 28, 6), C(160, 45, 6), C(100, 66, 8), C(70, 94, 6), C(130, 94, 6),
    E(68, 119, 7, 5), C(100, 119, 6), E(132, 119, 7, 5),
    P('20,30 23,37 30,37 24,41 26,48 20,44 14,48 16,41 10,37 17,37'), P('180,96 183,103 190,103 184,107 186,114 180,110 174,114 176,107 170,103 177,103'),

  ] },
  { name: 'Race car', paths: [
    'M-5 132 H205', 'M18 110 L22 96 Q40 88 70 88 L88 74 H118 L128 88 Q170 88 182 100 L184 110 Z',
    R(10, 62, 30, 8), 'M25 70 V92', C(104, 70, 10), 'M96 68 H112',

  { name: 'Trophy', paths: [

  { name: 'House', paths: ['M-5 132 Q100 124 205 132', R(55, 70, 80, 60), P('45,72 95,32 145,72'), R(85, 95, 20, 35), R(62, 82, 16, 14), R(112, 82, 16, 14), R(115, 38, 12, 22), C(170, 30, 14), 'M163 113 V131', C(165, 100, 16)] },
  { name: 'Fish', paths: ['M-5 136 Q100 128 205 136', P('140,75 180,45 172,75 180,105'), E(95, 75, 52, 34), C(70, 66, 7), C(71, 66, 2.5), 'M110 43 Q120 75 110 107', 'M126 47 Q134 75 126 103', E(98, 84, 14, 7), C(35, 35, 6), C(25, 18, 4), C(40, 8, 3), 'M188 136 Q180 120 188 105 T188 80', 'M12 136 Q20 122 12 108 T12 88'] },

    raf = requestAnimationFrame(step);

    if (seen[p] || wall(p)) return false;
    const i = p * 4;
    return Math.abs(d[i] - sr) + Math.abs(d[i + 1] - sg) + Math.abs(d[i + 2] - sb) <= TOL;
  };

  while (stack.length) {
    const y = stack.pop();
    let x = stack.pop();
    let p = y * W + x;
    if (!ok(p)) continue;
    while (x > 0 && ok(p - 1)) { x--; p--; }
    let up = false, dn = false;
    while (x < W && ok(p)) {
      seen[p] = 1;
      if (y > 0) { if (ok(p - W)) { if (!up) { stack.push(x, y - 1); up = true; } } else up = false; }

      const x = p % W;
      if (x > 0 && !seen[p - 1]) seen[p - 1] = mark;

      if (p < N - W && !seen[p + W]) seen[p + W] = mark;
    }

  for (let p = 0; p < N; p++) {

}

/* ---------- overlays ---------- */
function show(id) { $(id).classList.add('show'); }
function hideAll() { document.querySelectorAll('.ov').forEach((o) => o.classList.remove('show')); }
document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', hideAll));
document.querySelectorAll('.ov').forEach((o) => o.addEventListener('click', (e) => { if (e.target === o && (o.id !== 'whoOv' || load('kid'))) hideAll(); }));

const grid = $('#pageGrid');
PAGES.forEach((pg, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'pg' + (i === 0 ? ' blank' : '');
  const c = document.createElement('canvas');
  c.width = 400; c.height = 300;
  const x = c.getContext('2d');
  if (i === 0) {
    x.strokeStyle = '#B5A88F'; x.lineWidth = 10; x.lineCap = 'round';
    x.beginPath(); x.moveTo(200, 100); x.lineTo(200, 200); x.moveTo(150, 150); x.lineTo(250, 150); x.stroke();
  } else drawPage(x, pg, 2, 2.2);
  b.appendChild(c);
  b.appendChild(document.createTextNode(pg.name));
  b.addEventListener('click', () => newPicture(i));
  grid.appendChild(b);
});
function newPicture(i) {
  snap();                      // Undo brings the old picture back
  whitePaper();
  setPage(i);
  persist();
  hideAll();
  sfx('pop');
  say(PAGES[i].name);
}

$('#picsBtn').addEventListener('click', () => { sfx('tool'); say('Pictures'); show('#picsOv'); });
holdButton($('#clearBtn'), 2000, () => { snap(); whitePaper(); persist(); sfx('whoosh'); say('Fresh paper!'); }, 'Hold to start over');
holdButton($('#newFromSave'), 2000, () => { hideAll(); show('#picsOv'); }, 'Hold for a new picture');
$('#undoBtn').addEventListener('click', undo);

/* ---------- who is painting ---------- */
let kid = load('kid');
function showName() {
  $('#title').textContent = kid ? kid + "'s Paint Pad" : 'Paint Pad';
  document.title = $('#title').textContent;
}
function showSound() { $('#soundBtn').textContent = soundOn ? 'On' : 'Off'; }
document.querySelectorAll('.kid').forEach((b) => b.addEventListener('click', () => {
  kid = b.dataset.kid;
  store('kid', kid);
  showName();
  hideAll();
  sfx('chime');
  say('Hi ' + kid + '!');
}));
$('#soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  store('sound', soundOn ? 'on' : 'off');
  showSound();
  sfx('pop');
});
holdButton($('#brand'), 2000, () => { showSound(); show('#whoOv'); }, null);

let shareFile = null;
$('#saveBtn').addEventListener('click', () => {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.drawImage(paint, 0, 0);
  x.drawImage(lines, 0, 0);
  $('#saveImg').src = c.toDataURL('image/png');
  sfx('chime');
  say('Great picture!');
  shareFile = null;
  $('#shareBtn').hidden = true;
  $('#saveTip').textContent = 'Press and hold your picture, then tap Save to Photos.';
  if (navigator.canShare && window.File) {
    c.toBlob((blob) => {
      if (!blob) return;
      const f = new File([blob], (kid ? kid.toLowerCase() + '-' : '') + 'paint-pad-picture.png', { type: 'image/png' });
      if (navigator.canShare({ files: [f] })) {
        shareFile = f;
        $('#shareBtn').hidden = false;
        $('#saveTip').textContent = 'Tap Save to Photos, or press and hold your picture.';
      }
    }, 'image/png');
  }
  show('#saveOv');
});
$('#shareBtn').addEventListener('click', async () => {
  if (!shareFile) return;
  try { await navigator.share({ files: [shareFile], title: 'My picture' }); } catch (e) {}
});

/* ---------- start ---------- */
whitePaper();
// saved by name; older versions saved a position in the original list
const OLD_ORDER = ['Blank page', 'House', 'Fish', 'Flower', 'Rocket', 'Butterfly', 'Car', 'Cat'];
let savedName = load('page') || 'Blank page';
if (/^\d+$/.test(savedName)) savedName = OLD_ORDER[+savedName] || 'Blank page';
const savedIdx = PAGES.findIndex((pg) => pg.name === savedName);
setPage(savedIdx >= 0 ? savedIdx : 0);
const savedPaint = load('paint');
if (savedPaint) {
  const im = new Image();
  im.onload = () => {
    // a picture saved before the paper got wider sits in the middle at its old size
    const w = im.width * H / im.height;
    pc.drawImage(im, (W - w) / 2, 0, w, H);
  };
  im.src = savedPaint;
}
$('#undoBtn').disabled = true;
renderOpts();
fit();
showName();
showSound();
if (!kid) show('#whoOv');

// keep a copy on the iPad so the app opens with no connection (airplane mode)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
